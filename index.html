<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoNunes — Plataforma de Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111318;
    --surface2: #181c24;
    --border: #1e2330;
    --accent: #e8b84b;
    --accent2: #ff6b35;
    --text: #e8eaf0;
    --muted: #5a6380;
    --success: #2ecc71;
    --danger: #e74c3c;
    --warning: #f39c12;
    --info: #3498db;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

  /* LOGIN */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(ellipse at 30% 50%, #1a1200 0%, var(--bg) 70%); position: fixed; inset: 0; z-index: 100; transition: opacity .4s; }
  .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 48px; width: 380px; box-shadow: 0 40px 80px #00000080; }
  .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 36px; letter-spacing: 4px; color: var(--accent); margin-bottom: 8px; }
  .login-sub { color: var(--muted); font-size: 13px; margin-bottom: 36px; }
  .role-tabs { display: flex; gap: 8px; margin-bottom: 28px; }
  .role-tab { flex: 1; padding: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--muted); font-family: 'DM Sans'; transition: all .2s; text-align: center; }
  .role-tab.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
  .login-field { margin-bottom: 16px; }
  .login-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .login-field input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: 'DM Sans'; outline: none; transition: border .2s; }
  .login-field input:focus { border-color: var(--accent); }
  .btn-login { width: 100%; padding: 14px; background: var(--accent); color: #000; font-weight: 700; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans'; letter-spacing: .5px; margin-top: 8px; transition: opacity .2s; }
  .btn-login:hover { opacity: .9; }
  .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.6; }

  /* APP SHELL */
  #app { display: none; height: 100vh; flex-direction: column; }
  #app.visible { display: flex; }

  /* TOP NAV */
  .topnav { display: flex; align-items: center; padding: 0 24px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 24px; flex-shrink: 0; }
  .topnav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--accent); }
  .topnav-mode { font-size: 11px; padding: 3px 10px; border-radius: 4px; font-weight: 600; letter-spacing: 1px; }
  .mode-admin { background: #e8b84b20; color: var(--accent); }
  .mode-client { background: #3498db20; color: var(--info); }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab { padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--muted); transition: all .2s; border: none; background: none; font-family: 'DM Sans'; }
  .nav-tab:hover { color: var(--text); background: var(--surface2); }
  .nav-tab.active { color: var(--accent); background: #e8b84b15; font-weight: 600; }
  .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .cart-btn { position: relative; cursor: pointer; padding: 8px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); transition: all .2s; }
  .cart-btn:hover { border-color: var(--accent); }
  .cart-count { position: absolute; top: -6px; right: -6px; background: var(--accent2); color: #fff; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .user-info { font-size: 13px; color: var(--muted); }
  .btn-logout { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: 'DM Sans'; transition: all .2s; }
  .btn-logout:hover { color: var(--danger); border-color: var(--danger); }

  /* MAIN CONTENT */
  .main { flex: 1; overflow: auto; padding: 24px; }

  /* CARDS */
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .c-accent { color: var(--accent); }
  .c-success { color: var(--success); }
  .c-danger { color: var(--danger); }
  .c-info { color: var(--info); }

  /* PANEL */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .panel-title { font-size: 14px; font-weight: 600; }
  .panel-body { padding: 20px; }

  /* SEARCH & FILTERS */
  .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 200px; position: relative; }
  .search-box input { width: 100%; padding: 10px 14px 10px 38px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: 'DM Sans'; outline: none; transition: border .2s; }
  .search-box input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .filter-select { padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: 'DM Sans'; outline: none; cursor: pointer; }
  .filter-select:focus { border-color: var(--accent); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { padding: 10px 12px; text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; border-bottom: 1px solid var(--border); font-weight: 500; white-space: nowrap; }
  td { padding: 11px 12px; border-bottom: 1px solid #ffffff06; vertical-align: middle; }
  tr:hover td { background: #ffffff04; }
  .code { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-ok { background: #2ecc7120; color: var(--success); }
  .badge-low { background: #f39c1220; color: var(--warning); }
  .badge-out { background: #e74c3c20; color: var(--danger); }
  .price { font-family: 'DM Mono', monospace; font-size: 13px; }
  .btn-add { padding: 6px 14px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'DM Sans'; transition: opacity .2s; white-space: nowrap; }
  .btn-add:hover { opacity: .85; }
  .btn-add:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sm { padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-family: 'DM Sans'; border: 1px solid var(--border); background: var(--surface2); color: var(--text); transition: all .2s; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger-sm { background: #e74c3c20; border-color: #e74c3c40; color: var(--danger); }
  .btn-danger-sm:hover { background: #e74c3c30; }

  /* PAGINATION */
  .pagination { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-top: 1px solid var(--border); }
  .page-btn { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--muted); font-size: 12px; cursor: pointer; font-family: 'DM Sans'; transition: all .2s; }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
  .page-info { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* CART PANEL */
  .cart-sidebar { position: fixed; right: 0; top: 56px; bottom: 0; width: 380px; background: var(--surface); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .3s; z-index: 50; display: flex; flex-direction: column; }
  .cart-sidebar.open { transform: translateX(0); }
  .cart-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .cart-head h3 { font-size: 15px; font-weight: 600; }
  .cart-close { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }
  .cart-item { display: flex; gap: 12px; padding: 12px; background: var(--surface2); border-radius: 8px; margin-bottom: 10px; }
  .cart-item-info { flex: 1; }
  .cart-item-code { font-size: 11px; color: var(--accent); font-family: 'DM Mono', monospace; }
  .cart-item-name { font-size: 13px; margin: 3px 0; }
  .cart-item-price { font-size: 13px; color: var(--success); font-family: 'DM Mono'; }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .qty-btn { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
  .qty-val { font-size: 13px; font-family: 'DM Mono'; min-width: 24px; text-align: center; }
  .cart-item-remove { padding: 4px 8px; background: none; border: 1px solid #e74c3c30; border-radius: 4px; color: var(--danger); font-size: 11px; cursor: pointer; }
  .cart-foot { padding: 16px 20px; border-top: 1px solid var(--border); }
  .cart-total { display: flex; justify-content: space-between; margin-bottom: 16px; }
  .cart-total-label { font-size: 14px; color: var(--muted); }
  .cart-total-value { font-size: 22px; font-family: 'Bebas Neue'; color: var(--success); }
  .btn-checkout { width: 100%; padding: 14px; background: var(--success); color: #000; font-weight: 700; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans'; transition: opacity .2s; }
  .btn-checkout:hover { opacity: .9; }
  .empty-cart { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* ORDERS TABLE */
  .order-row { cursor: pointer; }
  .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .s-pending { background: #f39c1220; color: var(--warning); }
  .s-confirmed { background: #3498db20; color: var(--info); }
  .s-shipped { background: #9b59b620; color: #9b59b6; }
  .s-delivered { background: #2ecc7120; color: var(--success); }
  .s-cancelled { background: #e74c3c20; color: var(--danger); }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: #00000090; z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 560px; max-width: 95vw; max-height: 85vh; overflow-y: auto; }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-size: 16px; font-weight: 600; }
  .modal-body { padding: 24px; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .btn-primary { padding: 10px 20px; background: var(--accent); color: #000; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Sans'; font-size: 13px; }
  .btn-secondary { padding: 10px 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-family: 'DM Sans'; font-size: 13px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; font-family: 'DM Sans'; outline: none; }
  .form-group textarea { resize: vertical; min-height: 80px; }

  /* EDIT INLINE */
  .editable { cursor: pointer; border-bottom: 1px dashed var(--border); transition: border-color .2s; }
  .editable:hover { border-color: var(--accent); color: var(--accent); }

  /* ALERTS */
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; font-size: 13px; box-shadow: 0 8px 32px #00000060; z-index: 300; transform: translateY(20px); opacity: 0; transition: all .3s; max-width: 320px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast-success { border-left: 3px solid var(--success); }
  .toast-error { border-left: 3px solid var(--danger); }
  .toast-info { border-left: 3px solid var(--info); }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-size: 16px; margin-bottom: 8px; color: var(--text); }

  /* ADMIN EDIT PRODUCT */
  .inline-edit { background: var(--surface2); border-radius: 6px; padding: 4px 8px; border: 1px solid transparent; cursor: pointer; }
  .inline-edit:hover { border-color: var(--accent); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* RESPONSIVE TOPNAV */
  @media (max-width: 768px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .cart-sidebar { width: 100%; }
    .nav-tab span { display: none; }
  }

  /* NOTIFICATION DOT */
  .notif-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }

  /* CLIENT WELCOME */
  .welcome-banner { background: linear-gradient(135deg, #1a1200, var(--surface2)); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px; }
  .welcome-text h2 { font-family: 'Bebas Neue'; font-size: 28px; letter-spacing: 2px; color: var(--accent); }
  .welcome-text p { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* PRICE RANGE */
  .price-range { display: flex; align-items: center; gap: 8px; }
  .price-range input { width: 90px; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; font-family: 'DM Mono'; outline: none; }
  .price-range span { color: var(--muted); font-size: 12px; }
</style>
</head>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">AutoNunes</div>
    <div class="login-sub">Representação Comercial — Sistema de Pedidos</div>
    <div class="role-tabs">
      <div class="role-tab active" onclick="selectRole('admin')">🔧 Administrador</div>
      <div class="role-tab" onclick="selectRole('client')">🛒 Cliente</div>
    </div>
    <div class="login-field">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="Digite seu usuário" value="admin">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="••••••••" value="1234">
    </div>
    <button class="btn-login" onclick="doLogin()">Entrar na Plataforma</button>
    <div class="hint">Admin: admin / 1234 &nbsp;|&nbsp; Cliente: cliente / 1234</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOP NAV -->
  <div class="topnav">
    <div class="topnav-logo">AutoNunes</div>
    <div class="topnav-mode" id="mode-badge">ADMIN</div>
    <div class="nav-tabs" id="nav-tabs"></div>
    <div class="topnav-right">
      <div class="cart-btn" id="cart-btn" onclick="toggleCart()" style="display:none">
        🛒 Carrinho <div class="cart-count" id="cart-count">0</div>
      </div>
      <span class="user-info" id="user-label"></span>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main-content"></div>
</div>

<!-- CART SIDEBAR -->
<div class="cart-sidebar" id="cart-sidebar">
  <div class="cart-head">
    <h3>🛒 Carrinho de Compras</h3>
    <button class="cart-close" onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-foot">
    <div class="cart-total">
      <span class="cart-total-label">Total do Pedido</span>
      <span class="cart-total-value" id="cart-total">R$ 0,00</span>
    </div>
    <button class="btn-checkout" onclick="checkout()">Finalizar Pedido →</button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Modal</h3>
      <button class="cart-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

function openModal(title, body, foot) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-foot').innerHTML = foot || '';
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

// ============================================================
// AUTH
// ============================================================
let selectedRole = 'admin';
function selectRole(r) {
  selectedRole = r;
  document.querySelectorAll('.role-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && r==='admin') || (i===1 && r==='client'));
  });
  document.getElementById('login-user').value = r === 'admin' ? 'admin' : 'cliente';
}

function doLogin() {
  const u = document.getElementById('login-user').value;
  const p = document.getElementById('login-pass').value;
  if (p !== '1234') { showToast('Senha incorreta!', 'error'); return; }
  state.role = selectedRole;
  state.user = u;
  document.getElementById('login-screen').style.opacity = '0';
  setTimeout(() => document.getElementById('login-screen').style.display = 'none', 400);
  document.getElementById('app').classList.add('visible');
  initApp();
}

function doLogout() {
  document.getElementById('app').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  setTimeout(() => document.getElementById('login-screen').style.opacity = '1', 10);
  state.cart = [];
  state.currentTab = 'catalog';
}

// ============================================================
// APP INIT
// ============================================================
function initApp() {
  const badge = document.getElementById('mode-badge');
  badge.textContent = state.role === 'admin' ? 'ADMIN' : 'CLIENTE';
  badge.className = 'topnav-mode ' + (state.role === 'admin' ? 'mode-admin' : 'mode-client');
  document.getElementById('user-label').textContent = '👤 ' + state.user;

  const cartBtn = document.getElementById('cart-btn');
  cartBtn.style.display = state.role === 'client' ? 'flex' : 'none';

  buildNav();
  renderTab(state.currentTab);
}

function buildNav() {
  const adminTabs = [
    { id: 'catalog', label: '📦 Catálogo' },
    { id: 'orders', label: '📋 Pedidos' },
    { id: 'clients', label: '👥 Clientes' },
    { id: 'dashboard', label: '📊 Dashboard' },
  ];
  const clientTabs = [
    { id: 'catalog', label: '🛍️ Produtos' },
    { id: 'myorders', label: '📋 Meus Pedidos' },
  ];
  const tabs = state.role === 'admin' ? adminTabs : clientTabs;
  document.getElementById('nav-tabs').innerHTML = tabs.map(t =>
    `<button class="nav-tab ${state.currentTab === t.id ? 'active' : ''}" onclick="renderTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function renderTab(tab) {
  state.currentTab = tab;
  buildNav();
  const main = document.getElementById('main-content');
  if (tab === 'catalog') renderCatalog(main);
  else if (tab === 'orders') renderOrders(main);
  else if (tab === 'clients') renderClients(main);
  else if (tab === 'dashboard') renderDashboard(main);
  else if (tab === 'myorders') renderMyOrders(main);
}

// ============================================================
// CATALOG
// ============================================================
function getFilteredProducts() {
  return state.products.filter(p => {
    const q = state.catalogSearch.toLowerCase();
    const matchSearch = !q || p.descricao.toLowerCase().includes(q) || p.codigo.toLowerCase().includes(q);
    const matchGrupo = !state.catalogGrupo || p.grupo === state.catalogGrupo;
    const matchForn = !state.catalogFornecedor || p.fornecedor === state.catalogFornecedor;
    return matchSearch && matchGrupo && matchForn;
  });
}

function renderCatalog(el) {
  const grupos = [...new Set(state.products.map(p => p.grupo))].sort();
  const fornecedores = [...new Set(state.products.map(p => p.fornecedor))].sort();

  const filtered = getFilteredProducts();
  const totalPages = Math.ceil(filtered.length / state.pageSize);
  state.catalogPage = Math.min(state.catalogPage, Math.max(1, totalPages));
  const start = (state.catalogPage - 1) * state.pageSize;
  const page = filtered.slice(start, start + state.pageSize);

  const isAdmin = state.role === 'admin';

  const rows = page.map(p => {
    const estBadge = p.estoque === 0 ? 'badge-out' : p.estoque < 5 ? 'badge-low' : 'badge-ok';
    const estText = p.estoque === 0 ? 'Sem estoque' : p.estoque < 5 ? 'Baixo' : 'OK';
    const margin = ((p.preco_venda - p.preco_custo) / p.preco_venda * 100).toFixed(0);
    const canAdd = p.estoque > 0;
    return `<tr>
      <td><span class="code">${p.codigo}</span></td>
      <td style="max-width:240px">${p.descricao}</td>
      <td style="color:var(--muted);font-size:12px">${p.grupo.replace('Pecas originais GMB','Peças GM').replace('Pecas AC delco','AC Delco').replace('Combustivel & Lubrificante','Combustível').replace('Acessorios Originais','Acessórios')}</td>
      <td style="color:var(--muted);font-size:12px">${p.fornecedor}</td>
      <td><span class="badge ${estBadge}">${estText} (${p.estoque})</span></td>
      <td><span class="price">${fmt(p.preco_venda)}</span></td>
      ${isAdmin ? `<td><span class="price" style="color:var(--muted)">${fmt(p.preco_custo)}</span></td><td style="color:${+margin>30?'var(--success)':+margin>10?'var(--warning)':'var(--danger)'};font-family:'DM Mono'">${margin}%</td>` : ''}
      <td>
        ${isAdmin
          ? `<div style="display:flex;gap:6px">
              <button class="btn-sm" onclick="editProduct('${p.codigo}')">✏️ Editar</button>
             </div>`
          : `<button class="btn-add" onclick="addToCart('${p.codigo}')" ${!canAdd?'disabled':''}>+ Carrinho</button>`
        }
      </td>
    </tr>`;
  }).join('');

  const pageBtns = [];
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || Math.abs(i - state.catalogPage) <= 1) {
      pageBtns.push(`<button class="page-btn ${i===state.catalogPage?'active':''}" onclick="gotoPage(${i})">${i}</button>`);
    } else if (Math.abs(i - state.catalogPage) === 2) {
      pageBtns.push(`<span style="color:var(--muted)">…</span>`);
    }
  }

  el.innerHTML = `
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Buscar por código ou descrição..." value="${state.catalogSearch}"
          oninput="state.catalogSearch=this.value;state.catalogPage=1;renderTab('catalog')">
      </div>
      <select class="filter-select" onchange="state.catalogGrupo=this.value;state.catalogPage=1;renderTab('catalog')">
        <option value="">Todos os grupos</option>
        ${grupos.map(g => `<option value="${g}" ${state.catalogGrupo===g?'selected':''}>${g}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="state.catalogFornecedor=this.value;state.catalogPage=1;renderTab('catalog')">
        <option value="">Todos fornecedores</option>
        ${fornecedores.map(f => `<option value="${f}" ${state.catalogFornecedor===f?'selected':''}>${f}</option>`).join('')}
      </select>
      ${isAdmin ? `<button class="btn-add" onclick="openNewProduct()">+ Novo Produto</button>` : ''}
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📦 Catálogo de Produtos</span>
        <span style="font-size:12px;color:var(--muted);margin-left:auto">${filtered.length} produtos encontrados</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Descrição</th>
              <th>Grupo</th>
              <th>Fornecedor</th>
              <th>Estoque</th>
              <th>Preço Venda</th>
              ${isAdmin ? '<th>Custo</th><th>Margem</th>' : ''}
              <th>Ação</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="pagination">
        <button class="page-btn" onclick="gotoPage(${state.catalogPage-1})" ${state.catalogPage===1?'disabled':''}>‹</button>
        ${pageBtns.join('')}
        <button class="page-btn" onclick="gotoPage(${state.catalogPage+1})" ${state.catalogPage===totalPages?'disabled':''}>›</button>
        <span class="page-info">Página ${state.catalogPage} de ${totalPages} · ${filtered.length} itens</span>
      </div>
    </div>`;
}

function gotoPage(p) {
  const total = Math.ceil(getFilteredProducts().length / state.pageSize);
  state.catalogPage = Math.max(1, Math.min(p, total));
  renderTab('catalog');
}

function editProduct(codigo) {
  const p = state.products.find(x => x.codigo === codigo);
  if (!p) return;
  openModal(`Editar Produto — ${p.codigo}`,
    `<div class="form-row">
      <div class="form-group"><label>Código</label><input id="ep-cod" value="${p.codigo}" readonly style="opacity:.6"></div>
      <div class="form-group"><label>Fornecedor</label><input id="ep-forn" value="${p.fornecedor}"></div>
    </div>
    <div class="form-group"><label>Descrição</label><input id="ep-desc" value="${p.descricao}"></div>
    <div class="form-row">
      <div class="form-group"><label>Estoque</label><input id="ep-est" type="number" value="${p.estoque}"></div>
      <div class="form-group"><label>Grupo</label><input id="ep-grupo" value="${p.grupo}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Preço de Venda (R$)</label><input id="ep-pv" type="number" step="0.01" value="${p.preco_venda}"></div>
      <div class="form-group"><label>Preço de Custo (R$)</label><input id="ep-pc" type="number" step="0.01" value="${p.preco_custo}"></div>
    </div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="saveProduct('${p.codigo}')">💾 Salvar Alterações</button>`
  );
}

function saveProduct(codigo) {
  const p = state.products.find(x => x.codigo === codigo);
  if (!p) return;
  p.descricao = document.getElementById('ep-desc').value;
  p.fornecedor = document.getElementById('ep-forn').value;
  p.estoque = parseInt(document.getElementById('ep-est').value) || 0;
  p.grupo = document.getElementById('ep-grupo').value;
  p.preco_venda = parseFloat(document.getElementById('ep-pv').value) || 0;
  p.preco_custo = parseFloat(document.getElementById('ep-pc').value) || 0;
  closeModal();
  showToast('Produto atualizado com sucesso!', 'success');
  renderTab('catalog');
}

function openNewProduct() {
  openModal('Novo Produto',
    `<div class="form-row">
      <div class="form-group"><label>Código</label><input id="np-cod" placeholder="Ex: 99999999"></div>
      <div class="form-group"><label>Fornecedor</label><select id="np-forn"><option>GM</option><option>Outros</option></select></div>
    </div>
    <div class="form-group"><label>Descrição</label><input id="np-desc" placeholder="Descrição do produto"></div>
    <div class="form-row">
      <div class="form-group"><label>Estoque</label><input id="np-est" type="number" value="0"></div>
      <div class="form-group"><label>Grupo</label><input id="np-grupo" placeholder="Ex: Pecas originais GMB"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Preço de Venda (R$)</label><input id="np-pv" type="number" step="0.01" value="0"></div>
      <div class="form-group"><label>Preço de Custo (R$)</label><input id="np-pc" type="number" step="0.01" value="0"></div>
    </div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="createProduct()">✅ Criar Produto</button>`
  );
}

function createProduct() {
  const cod = document.getElementById('np-cod').value.trim();
  if (!cod) { showToast('Informe o código!', 'error'); return; }
  if (state.products.find(p => p.codigo === cod)) { showToast('Código já existe!', 'error'); return; }
  state.products.unshift({
    codigo: cod,
    descricao: document.getElementById('np-desc').value,
    fornecedor: document.getElementById('np-forn').value,
    estoque: parseInt(document.getElementById('np-est').value) || 0,
    grupo: document.getElementById('np-grupo').value,
    preco_venda: parseFloat(document.getElementById('np-pv').value) || 0,
    preco_custo: parseFloat(document.getElementById('np-pc').value) || 0,
    giro: 0, reservado: 0, ultima_venda: '',
  });
  closeModal();
  showToast('Produto criado!', 'success');
  state.catalogPage = 1;
  renderTab('catalog');
}

// ============================================================
// CART
// ============================================================
function addToCart(codigo) {
  const p = state.products.find(x => x.codigo === codigo);
  if (!p || p.estoque === 0) return;
  const existing = state.cart.find(c => c.codigo === codigo);
  if (existing) {
    if (existing.qty >= p.estoque) { showToast('Quantidade máxima atingida!', 'error'); return; }
    existing.qty++;
  } else {
    state.cart.push({ codigo: p.codigo, descricao: p.descricao, preco: p.preco_venda, qty: 1, maxQty: p.estoque });
  }
  updateCartBadge();
  renderCartSidebar();
  showToast(`"${p.descricao.slice(0,30)}" adicionado ao carrinho!`, 'success');
}

function updateCartBadge() {
  const n = state.cart.reduce((s, c) => s + c.qty, 0);
  document.getElementById('cart-count').textContent = n;
}

function toggleCart() {
  document.getElementById('cart-sidebar').classList.toggle('open');
  renderCartSidebar();
}

function renderCartSidebar() {
  const el = document.getElementById('cart-items');
  if (state.cart.length === 0) {
    el.innerHTML = '<div class="empty-cart">🛒<br><br>Carrinho vazio<br><small>Adicione produtos do catálogo</small></div>';
    document.getElementById('cart-total').textContent = 'R$ 0,00';
    return;
  }
  el.innerHTML = state.cart.map(c => `
    <div class="cart-item">
      <div class="cart-item-info">
        <div class="cart-item-code">${c.codigo}</div>
        <div class="cart-item-name">${c.descricao.slice(0,40)}</div>
        <div class="cart-item-price">${fmt(c.preco)} / un</div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${c.codigo}',-1)">−</button>
          <span class="qty-val">${c.qty}</span>
          <button class="qty-btn" onclick="changeQty('${c.codigo}',1)">+</button>
          <button class="cart-item-remove" onclick="removeFromCart('${c.codigo}')">🗑</button>
        </div>
      </div>
      <div style="font-family:'DM Mono';font-size:14px;color:var(--success);white-space:nowrap">${fmt(c.preco * c.qty)}</div>
    </div>`).join('');
  const total = state.cart.reduce((s, c) => s + c.preco * c.qty, 0);
  document.getElementById('cart-total').textContent = fmt(total);
}

function changeQty(codigo, delta) {
  const c = state.cart.find(x => x.codigo === codigo);
  if (!c) return;
  c.qty = Math.max(1, Math.min(c.qty + delta, c.maxQty));
  updateCartBadge();
  renderCartSidebar();
}

function removeFromCart(codigo) {
  state.cart = state.cart.filter(c => c.codigo !== codigo);
  updateCartBadge();
  renderCartSidebar();
}

function checkout() {
  if (state.cart.length === 0) return;
  const total = state.cart.reduce((s, c) => s + c.preco * c.qty, 0);
  const itens = state.cart.reduce((s, c) => s + c.qty, 0);
  const itemList = state.cart.map(c => `<li style="margin-bottom:6px"><b>${c.codigo}</b> — ${c.descricao.slice(0,40)} × ${c.qty} = <span style="color:var(--success)">${fmt(c.preco*c.qty)}</span></li>`).join('');
  openModal('Confirmar Pedido',
    `<div style="background:var(--surface2);border-radius:8px;padding:16px;margin-bottom:16px">
      <ul style="list-style:none;padding:0">${itemList}</ul>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="color:var(--muted)">Total (${itens} itens)</span>
      <span style="font-family:'Bebas Neue';font-size:24px;color:var(--success)">${fmt(total)}</span>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="obs-pedido" placeholder="Ex: Entrega urgente, prazo..."></textarea></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="confirmOrder()">✅ Confirmar Pedido</button>`
  );
}

function confirmOrder() {
  const obs = document.getElementById('obs-pedido')?.value || '';
  const total = state.cart.reduce((s, c) => s + c.preco * c.qty, 0);
  const itens = state.cart.reduce((s, c) => s + c.qty, 0);
  // Decrease stock
  state.cart.forEach(c => {
    const p = state.products.find(x => x.codigo === c.codigo);
    if (p) p.estoque = Math.max(0, p.estoque - c.qty);
  });
  state.orders.unshift({
    id: genId(), cliente: state.user, data: today(),
    total, status: 'pending', itens, obs,
    produtos: [...state.cart],
  });
  state.cart = [];
  updateCartBadge();
  document.getElementById('cart-sidebar').classList.remove('open');
  closeModal();
  showToast('Pedido realizado com sucesso! 🎉', 'success');
  renderTab('catalog');
}

const statusLabel = { pending: 'Pendente', confirmed: 'Confirmado', shipped: 'Enviado', delivered: 'Entregue', cancelled: 'Cancelado' };
const statusClass = { pending: 's-pending', confirmed: 's-confirmed', shipped: 's-shipped', delivered: 's-delivered', cancelled: 's-cancelled' };

function renderOrders(el) {
  const rows = state.orders.map(o => `
    <tr class="order-row" onclick="viewOrder('${o.id}')">
      <td><span class="code">${o.id}</span></td>
      <td>${o.cliente}</td>
      <td style="color:var(--muted);font-size:12px">${o.data}</td>
      <td>${o.itens} itens</td>
      <td><span class="price">${fmt(o.total)}</span></td>
      <td><span class="status-badge ${statusClass[o.status]}">${statusLabel[o.status]}</span></td>
      <td>
        <select class="filter-select" style="padding:4px 8px;font-size:12px" onchange="changeStatus('${o.id}',this.value)" onclick="event.stopPropagation()">
          ${Object.entries(statusLabel).map(([k,v]) => `<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total de Pedidos</div><div class="stat-value c-accent">${state.orders.length}</div></div>
      <div class="stat-card"><div class="stat-label">Pendentes</div><div class="stat-value c-warning">${state.orders.filter(o=>o.status==='pending').length}</div></div>
      <div class="stat-card"><div class="stat-label">Em Entrega</div><div class="stat-value c-info">${state.orders.filter(o=>o.status==='shipped').length}</div></div>
      <div class="stat-card"><div class="stat-label">Faturamento</div><div class="stat-value c-success">${fmt(state.orders.reduce((s,o)=>s+o.total,0))}</div></div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📋 Gestão de Pedidos</span>
        <button class="btn-add" style="margin-left:auto" onclick="openNewOrder()">+ Novo Pedido</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Nº Pedido</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th><th>Alterar Status</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function changeStatus(id, newStatus) {
  const o = state.orders.find(x => x.id === id);
  if (o) { o.status = newStatus; showToast(`Pedido ${id} → ${statusLabel[newStatus]}`, 'info'); renderTab('orders'); }
}

function viewOrder(id) {
  const o = state.orders.find(x => x.id === id);
  if (!o) return;
  const items = o.produtos ? o.produtos.map(p => `<li>${p.codigo} — ${p.descricao.slice(0,40)} × ${p.qty} = ${fmt(p.preco*p.qty)}</li>`).join('') : '<li>Detalhes não disponíveis</li>';
  openModal(`Pedido ${o.id}`,
    `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div><label style="font-size:11px;color:var(--muted)">CLIENTE</label><div>${o.cliente}</div></div>
      <div><label style="font-size:11px;color:var(--muted)">DATA</label><div>${o.data}</div></div>
      <div><label style="font-size:11px;color:var(--muted)">STATUS</label><div><span class="status-badge ${statusClass[o.status]}">${statusLabel[o.status]}</span></div></div>
      <div><label style="font-size:11px;color:var(--muted)">TOTAL</label><div style="color:var(--success);font-family:'DM Mono'">${fmt(o.total)}</div></div>
    </div>
    <div style="background:var(--surface2);border-radius:8px;padding:14px;margin-bottom:12px"><ul style="list-style:none;padding:0;font-size:13px">${items}</ul></div>
    ${o.obs ? `<div style="color:var(--muted);font-size:12px">📝 ${o.obs}</div>` : ''}`,
    `<button class="btn-secondary" onclick="closeModal()">Fechar</button>`
  );
}

function openNewOrder() {
  const clientOpts = state.clients.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
  openModal('Registrar Pedido Manual',
    `<div class="form-row">
      <div class="form-group"><label>Cliente</label><select id="no-cli">${clientOpts}</select></div>
      <div class="form-group"><label>Total (R$)</label><input id="no-total" type="number" step="0.01" value="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Nº de Itens</label><input id="no-itens" type="number" value="1"></div>
      <div class="form-group"><label>Status Inicial</label><select id="no-status"><option value="pending">Pendente</option><option value="confirmed">Confirmado</option></select></div>
    </div>
    <div class="form-group"><label>Observações</label><textarea id="no-obs"></textarea></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="createOrder()">✅ Criar Pedido</button>`
  );
}

function createOrder() {
  state.orders.unshift({
    id: genId(), cliente: document.getElementById('no-cli').value,
    data: today(), total: parseFloat(document.getElementById('no-total').value)||0,
    status: document.getElementById('no-status').value,
    itens: parseInt(document.getElementById('no-itens').value)||1,
    obs: document.getElementById('no-obs').value,
  });
  closeModal(); showToast('Pedido criado!', 'success'); renderTab('orders');
}

// CLIENTS
// ============================================================
function renderClients(el) {
  const rows = state.clients.map(c => `
    <tr>
      <td><span class="code">${c.id}</span></td>
      <td><b>${c.nome}</b></td>
      <td style="font-family:'DM Mono';font-size:12px">${c.cnpj}</td>
      <td style="color:var(--muted)">${c.tel}</td>
      <td><a href="mailto:${c.email}" style="color:var(--info);font-size:12px">${c.email}</a></td>
      <td style="color:var(--muted)">${c.cidade}</td>
      <td style="color:var(--success);font-family:'DM Mono'">
        ${fmt(state.orders.filter(o=>o.cliente===c.nome).reduce((s,o)=>s+o.total,0))}
      </td>
      <td>
        <button class="btn-sm" onclick="editClient('${c.id}')">✏️ Editar</button>
      </td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">👥 Cadastro de Clientes</span>
        <button class="btn-add" style="margin-left:auto" onclick="openNewClient()">+ Novo Cliente</button>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>ID</th><th>Nome</th><th>CNPJ</th><th>Telefone</th><th>E-mail</th><th>Cidade</th><th>Total Compras</th><th>Ação</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}

function openNewClient() {
  openModal('Novo Cliente',
    `<div class="form-row">
      <div class="form-group"><label>Nome / Razão Social</label><input id="nc-nome" placeholder="Ex: Oficina Santos"></div>
      <div class="form-group"><label>CNPJ</label><input id="nc-cnpj" placeholder="00.000.000/0001-00"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Telefone</label><input id="nc-tel" placeholder="(82) 99999-0000"></div>
      <div class="form-group"><label>Cidade</label><input id="nc-cidade" placeholder="Maceió"></div>
    </div>
    <div class="form-group"><label>E-mail</label><input id="nc-email" type="email" placeholder="email@empresa.com"></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="createClient()">✅ Cadastrar Cliente</button>`
  );
}

function createClient() {
  const id = 'CLI-' + String(state.clients.length + 1).padStart(3, '0');
  state.clients.push({
    id, nome: document.getElementById('nc-nome').value,
    cnpj: document.getElementById('nc-cnpj').value,
    tel: document.getElementById('nc-tel').value,
    email: document.getElementById('nc-email').value,
    cidade: document.getElementById('nc-cidade').value,
  });
  closeModal(); showToast('Cliente cadastrado!', 'success'); renderTab('clients');
}

function editClient(id) {
  const c = state.clients.find(x => x.id === id);
  if (!c) return;
  openModal(`Editar Cliente — ${c.nome}`,
    `<div class="form-row">
      <div class="form-group"><label>Nome</label><input id="ec-nome" value="${c.nome}"></div>
      <div class="form-group"><label>CNPJ</label><input id="ec-cnpj" value="${c.cnpj}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Telefone</label><input id="ec-tel" value="${c.tel}"></div>
      <div class="form-group"><label>Cidade</label><input id="ec-cidade" value="${c.cidade}"></div>
    </div>
    <div class="form-group"><label>E-mail</label><input id="ec-email" value="${c.email}"></div>`,
    `<button class="btn-secondary" onclick="closeModal()">Cancelar</button>
     <button class="btn-primary" onclick="saveClient('${c.id}')">💾 Salvar</button>`
  );
}

function saveClient(id) {
  const c = state.clients.find(x => x.id === id);
  c.nome = document.getElementById('ec-nome').value;
  c.cnpj = document.getElementById('ec-cnpj').value;
  c.tel = document.getElementById('ec-tel').value;
  c.email = document.getElementById('ec-email').value;
  c.cidade = document.getElementById('ec-cidade').value;
  closeModal(); showToast('Cliente atualizado!', 'success'); renderTab('clients');
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(el) {
  const totalEstoque = state.products.reduce((s, p) => s + p.estoque, 0);
  const valorEstoque = state.products.reduce((s, p) => s + p.estoque * p.preco_custo, 0);
  const semEstoque = state.products.filter(p => p.estoque === 0).length;
  const estoqueMin = state.products.filter(p => p.estoque > 0 && p.estoque < 5).length;
  const faturamento = state.orders.reduce((s, o) => s + o.total, 0);

  const topProdutos = [...state.products].sort((a,b) => b.giro - a.giro).slice(0, 8);
  const topRows = topProdutos.map(p => {
    const pct = Math.round((p.giro / (topProdutos[0].giro || 1)) * 100);
    return `<tr>
      <td><span class="code">${p.codigo}</span></td>
      <td>${p.descricao.slice(0,40)}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;background:var(--surface2);border-radius:4px;height:6px">
            <div style="width:${pct}%;background:var(--accent);height:6px;border-radius:4px"></div>
          </div>
          <span style="font-family:'DM Mono';font-size:12px;color:var(--muted)">${p.giro}</span>
        </div>
      </td>
      <td><span class="price">${fmt(p.preco_venda)}</span></td>
    </tr>`;
  }).join('');

  const grupos = {};
  state.products.forEach(p => { grupos[p.grupo] = (grupos[p.grupo]||0)+1; });
  const grupoCols = Object.entries(grupos).sort((a,b)=>b[1]-a[1]).map(([g,n]) => `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:13px">${g.replace('Pecas originais GMB','Peças GM').replace('Pecas AC delco','AC Delco')}</span>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:100px;background:var(--surface2);border-radius:4px;height:6px">
          <div style="width:${Math.round(n/state.products.length*100)}%;background:var(--accent);height:6px;border-radius:4px"></div>
        </div>
        <span style="font-family:'DM Mono';font-size:12px;color:var(--muted);min-width:30px">${n}</span>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total em Estoque</div><div class="stat-value c-accent">${totalEstoque.toLocaleString('pt-BR')}</div><div class="stat-sub">unidades</div></div>
      <div class="stat-card"><div class="stat-label">Valor do Estoque</div><div class="stat-value c-success">${fmt(valorEstoque)}</div><div class="stat-sub">custo total</div></div>
      <div class="stat-card"><div class="stat-label">Sem Estoque</div><div class="stat-value c-danger">${semEstoque}</div><div class="stat-sub">${estoqueMin} com estoque baixo</div></div>
      <div class="stat-card"><div class="stat-label">Faturamento Pedidos</div><div class="stat-value c-info">${fmt(faturamento)}</div><div class="stat-sub">${state.orders.length} pedidos</div></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">🔥 Produtos Mais Girados</span></div>
        <div class="table-wrap">
          <table><thead><tr><th>Código</th><th>Produto</th><th>Giro (dias)</th><th>Preço</th></tr></thead>
          <tbody>${topRows}</tbody></table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">📂 Distribuição por Grupo</span></div>
        <div class="panel-body">${grupoCols}</div>
      </div>
    </div>`;
}

// ============================================================
// MY ORDERS (CLIENT)
// ============================================================
function renderMyOrders(el) {
  const myOrders = state.orders.filter(o => o.cliente === state.user);

  if (myOrders.length === 0) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><h3>Nenhum pedido ainda</h3><p>Acesse o catálogo e faça seu primeiro pedido!</p></div>`;
    return;
  }

  const rows = myOrders.map(o => `
    <tr onclick="viewOrder('${o.id}')" style="cursor:pointer">
      <td><span class="code">${o.id}</span></td>
      <td style="color:var(--muted)">${o.data}</td>
      <td>${o.itens} itens</td>
      <td><span class="price">${fmt(o.total)}</span></td>
      <td><span class="status-badge ${statusClass[o.status]}">${statusLabel[o.status]}</span></td>
    </tr>`).join('');

  el.innerHTML = `
    <div class="welcome-banner">
      <div style="font-size:48px">📦</div>
      <div class="welcome-text">
        <h2>Meus Pedidos</h2>
        <p>Acompanhe seus pedidos e histórico de compras</p>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title">📋 Histórico de Pedidos</span></div>
      <div class="table-wrap">
        <table><thead><tr><th>Nº Pedido</th><th>Data</th><th>Itens</th><th>Total</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}
